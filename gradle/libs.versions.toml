[versions]
kotlinx-html = "0.12.0"
kotlinx-datetime = "0.6.0"
kotlinx-serialization-json = "1.7.3"
ktor = "3.1.3"
directory-watcher = "0.18.0"
flexmark = "0.64.8"
gradle-tooling-api = "9.5.0"

[libraries]
kotlinx-html = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version.ref = "kotlinx-html" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-html-builder = { module = "io.ktor:ktor-server-html-builder", version.ref = "ktor" }
directory-watcher = { module = "io.methvin:directory-watcher", version.ref = "directory-watcher" }
flexmark = { module = "com.vladsch.flexmark:flexmark-all", version.ref = "flexmark" }
gradle-tooling-api = { module = "org.gradle:gradle-tooling-api", version.ref = "gradle-tooling-api" }
